<meta name="theme-color" content="#1a1a1a">
<style>
:root{
  --paper:#F6F4F3;--surface:#FFFFFF;--ink:#1A1A1A;--muted:#6B6264;--rule:#E3DCDC;--fill:#F6F4F3;--mid:#8A7F82;--radius:10px;
  --alert:#A51C30;--alert-soft:#F6E4E7;
  --g:#2F6F45;--gs:#E3F0E7;--b:#1F5A99;--bs:#E1ECF8;--n:#5B5557;--ns:#ECE8E8;
  --accent:var(--n);--accent-soft:var(--ns);--accent-ink:#fff;color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#151314;--surface:#1F1C1D;--ink:#EEE9E9;--muted:#A79C9E;--rule:#352F31;--fill:#262122;--mid:#A79C9E;
  --alert:#E0566B;--alert-soft:#3A1F25;--g:#5DB57A;--gs:#1D2E24;--b:#6EA6E8;--bs:#1B2837;--n:#B9B0B2;--ns:#2B2627;--accent-ink:#111;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#151314;--surface:#1F1C1D;--ink:#EEE9E9;--muted:#A79C9E;--rule:#352F31;--fill:#262122;--mid:#A79C9E;
  --alert:#E0566B;--alert-soft:#3A1F25;--g:#5DB57A;--gs:#1D2E24;--b:#6EA6E8;--bs:#1B2837;--n:#B9B0B2;--ns:#2B2627;--accent-ink:#111;color-scheme:dark}
body[data-dom=PLT]{--accent:var(--g);--accent-soft:var(--gs)}
body[data-dom=DRL]{--accent:var(--b);--accent-soft:var(--bs)}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:15px/1.5 Aptos,"Segoe UI",system-ui,-apple-system,sans-serif}
header{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 22px;border-bottom:4px solid;border-image:linear-gradient(90deg,#2F6F45 50%,#1F5A99 50%) 1;padding:18px 20px 12px;max-width:1500px;margin:0 auto}
header .logo img{height:34px;display:block;border-radius:3px}
header .brand{display:grid;gap:2px}
header .brand small{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:700}
header h1{margin:0;font-size:26px;line-height:1.15;font-weight:700}
header .sub{color:var(--muted);font-size:12.5px}
.hr{margin-left:auto;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
#gq{width:340px;border-radius:999px;padding:6px 14px}
nav{display:flex;gap:6px;flex-wrap:wrap}
nav button{background:transparent;color:var(--accent);border:1px solid var(--rule);border-radius:999px;font:inherit;font-weight:600;font-size:13.5px;padding:5px 14px;cursor:pointer}
nav button:hover{border-color:var(--accent)}
nav button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
nav .badge{background:var(--alert);color:#fff;border-radius:999px;font-size:11px;padding:0 6px;margin-left:6px}
main{max-width:1500px;margin:0 auto;padding:22px 20px 60px}
h2{margin:0 0 14px;font-size:26px;line-height:1.15;font-weight:700}
h3{margin:0 0 8px;font-size:16px;font-weight:700}
.sec-head{margin:28px 0 10px;color:var(--muted);font-size:13px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.sec-head .r{font-weight:600;font-size:12.5px;letter-spacing:0;text-transform:none}
.panel{background:var(--surface);border:1px solid var(--rule);border-radius:var(--radius);padding:14px 18px;overflow:auto}
.grid{display:grid;gap:16px}.g6{grid-template-columns:repeat(6,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g2{grid-template-columns:1fr 1fr}
@media(max-width:1250px){.g4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:1100px){.g6{grid-template-columns:repeat(3,1fr)}.g3,.g2{grid-template-columns:1fr}}
@media(max-width:640px){.g4{grid-template-columns:1fr}}
@media(max-width:640px){.g6{grid-template-columns:repeat(2,1fr)}}
.kpi{border:1px solid var(--rule);border-radius:var(--radius);padding:14px 16px;background:var(--surface);cursor:pointer}
.kpi:hover{border-color:var(--accent)}.kpi .n{font-size:30px;font-weight:700;line-height:1.1}.kpi.red .n{color:var(--alert)}.kpi .l{color:var(--muted);font-size:13px}
.dcard{border:1px solid var(--rule);border-top:6px solid var(--dc);border-radius:var(--radius);padding:16px 18px;background:var(--surface)}
.dcard h3{font-size:19px;color:var(--dc)}
.dcard .big{font-size:34px;font-weight:700;line-height:1.1}
.stack{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--fill);border:1px solid var(--rule);margin:10px 0 6px}
.stack i{display:block;height:100%}
.lg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted)}.lg.cnt strong{color:var(--ink);margin-left:2px}.lg b{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.tile{border:1px solid var(--rule);border-left:5px solid var(--dc);border-radius:8px;padding:10px 12px;background:var(--surface);cursor:pointer}
.tile:hover{background:var(--fill)}.tile b{display:block}.tile span{font-size:12.5px;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.note{color:var(--muted);font-size:13px}.tag{font-size:12px;color:var(--muted)}
table{border-collapse:collapse;width:100%;background:var(--surface);border:1px solid var(--rule);border-radius:var(--radius);overflow:hidden}
th{background:var(--fill);color:var(--muted);text-align:left;padding:9px 12px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;border-bottom:1px solid var(--rule)}
td{padding:9px 12px;border-top:1px solid var(--rule);vertical-align:top}
tr.row{cursor:pointer}tr.row:hover td{background:var(--fill)}
tr.grp td{background:var(--accent-soft);font-weight:700;color:var(--accent);letter-spacing:.04em;cursor:default}
.chip{display:inline-flex;align-items:center;font-size:12px;padding:1px 9px;border:1px solid var(--rule);border-radius:999px;margin:1px 4px 1px 0;white-space:nowrap;background:var(--surface);color:var(--muted)}
.chip.approved{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.chip.reviewed{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);opacity:.8;font-weight:600}
.chip.review{background:var(--accent-soft);color:var(--accent);border-color:var(--accent);font-weight:600}
.chip.drafting{border-color:var(--accent);color:var(--accent)}
.chip.existing{border-style:dashed}
.chip.gap{background:var(--alert-soft);color:var(--alert);border-color:var(--alert);font-weight:600}
.chip.od{background:var(--alert);color:#fff;border-color:var(--alert);font-weight:700}
.chip.p1{background:var(--ink);color:var(--paper);border-color:var(--ink);font-weight:700}
.chip.f{border-color:var(--alert);color:var(--alert)}
.chip.NC{background:var(--alert-soft);color:var(--alert);border-color:var(--alert);font-weight:700}
.chip.OI{border-color:var(--mid);color:var(--ink);font-weight:600}
.chip.VN{background:var(--ink);color:var(--paper);border-color:var(--ink);font-weight:700}
.chip.G{border-style:dotted}
.dot{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
button,.btn{font:inherit;font-weight:600;font-size:14px;padding:7px 16px;border-radius:7px;border:1px solid var(--accent);background:transparent;color:var(--accent);cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--accent-soft)}.btn.p,.btn.k{background:var(--accent);color:var(--accent-ink)}.btn.sm{padding:2px 10px;font-size:12.5px}.btn.d{border-color:var(--alert);color:var(--alert)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{font:inherit;border:1px solid var(--rule);border-radius:7px;padding:6px 9px;background:var(--paper);color:var(--ink);max-width:100%}
textarea{width:100%;min-height:80px}
td input,td select{padding:3px 6px;font-size:13.5px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(720px,100%);background:var(--surface);border-left:4px solid var(--accent);z-index:40;overflow:auto;padding:18px 22px 40px;box-shadow:-6px 0 24px rgba(0,0,0,.2);transform:translateX(105%);transition:transform .18s}
#drawer.open{transform:none}
#veil{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:30;display:none}#veil.on{display:block}
.kv{display:grid;grid-template-columns:140px 1fr;gap:8px 14px;margin:10px 0;align-items:center}.kv>div:nth-child(odd){color:var(--muted);font-size:13px}
.card{border:1px solid var(--rule);border-radius:var(--radius);padding:14px 18px;margin:12px 0;background:var(--surface)}
.banner{border:1px solid var(--alert);background:var(--alert-soft);border-radius:var(--radius);padding:12px 16px;margin-bottom:16px}
.banner b{color:var(--alert)}
.heat{display:grid;gap:3px;font-size:12px}
.heat div{padding:5px 6px;border-radius:4px;text-align:center;background:var(--fill)}
.heat .h{background:transparent;font-weight:700;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.heat .r{text-align:left;background:transparent;font-weight:600}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:8px;z-index:60;font-size:14px;display:none}
a{color:var(--accent)}.hide{display:none}code{background:var(--fill);padding:1px 5px;border-radius:4px;white-space:nowrap}
pre.tpl{white-space:pre-wrap;background:var(--fill);padding:12px;border-radius:8px;font:13px/1.5 ui-monospace,Consolas,monospace}
@media print{header .hr,.bar,#drawer,#veil,nav{display:none}}
</style>

const GRAPH='https://graph.microsoft.com/v1.0',SCOPES=['Files.ReadWrite','User.Read'];
const DEFAULT_PATH='Documents/Current document editing/new AI projects/state gas sop/private/sop_data.json';
let MSAL=null,ACC=null,ETAG=null;
const jget=k=>{try{return JSON.parse(localStorage.getItem(k)||'null')}catch(e){return null}};
const cfg=()=>{const c=jget('sgsop_cfg');if(c)return c;const o=jget('sg_cfg');return o&&o.clientId?{clientId:o.clientId,tenant:o.tenant||'common',path:DEFAULT_PATH}:null};
async function loadState(){

  MODE='cloud';return await cloudLoad();

async function msalToken(interactive){
  try{return (await MSAL.acquireTokenSilent({scopes:SCOPES,account:ACC})).accessToken}
  catch(e){if(!interactive)throw e;const x=await MSAL.acquireTokenPopup({scopes:SCOPES,account:ACC});ACC=x.account;return x.accessToken}
}
async function cloudLoad(){
  const c=cfg();
  if(!c||!c.clientId){showSetup();return false}
  if(!window.msal){showSetup('The Microsoft sign-in library did not load - check your connection and reload.');return false}
  MSAL=new msal.PublicClientApplication({auth:{clientId:c.clientId,authority:'https://login.microsoftonline.com/'+(c.tenant||'common'),redirectUri:location.origin+location.pathname},cache:{cacheLocation:'localStorage'}});
  if(MSAL.initialize)await MSAL.initialize();
  try{await MSAL.handleRedirectPromise()}catch(e){}
  ACC=MSAL.getAllAccounts()[0]||null;
  if(!ACC){showSignIn();return false}
  try{
    const t=await msalToken(false),h={Authorization:'Bearer '+t},path=encodeURI(c.path||DEFAULT_PATH);
    const meta=await fetch(GRAPH+'/me/drive/root:/'+path,{headers:h});
    if(meta.status===404){ETAG=null;showSignIn('Your data file was not found at: '+(c.path||DEFAULT_PATH)+'. Check the path (it must have synced to OneDrive).');return false}
    if(!meta.ok)throw new Error('OneDrive '+meta.status);
    ETAG=(await meta.json()).eTag;
    const r=await fetch(GRAPH+'/me/drive/root:/'+path+':/content',{headers:h});
    if(!r.ok)throw new Error('OneDrive '+r.status);
    Object.assign(ST,await r.json());return true;
  }catch(e){const soft=/timeout|interaction_required|login_required|consent_required|no_account|token_renewal|iframe/i.test((e.errorCode||'')+' '+(e.message||''));
    showSignIn(soft?'Your Microsoft sign-in needs refreshing. Click Sign in with Microsoft.':'Could not load your data: '+e.message);return false}
}
async function cloudSave(){
  const c=cfg(),path=encodeURI(c.path||DEFAULT_PATH),t=await msalToken(true);
  const h={Authorization:'Bearer '+t,'Content-Type':'application/json'};if(ETAG)h['If-Match']=ETAG;
  const r=await fetch(GRAPH+'/me/drive/root:/'+path+':/content',{method:'PUT',headers:h,body:JSON.stringify(ST)});
  if(r.status===412){toast('Data was changed elsewhere - reload the page before editing further');return}
  if(!r.ok)throw new Error('OneDrive '+r.status);
  ETAG=(await r.json()).eTag;
}

function startList(){
  const sorted=a=>a.sort((x,y)=>x.p-y.p||x.id.localeCompare(y.id));
  const G=[
   ['Reviewed - ready for you to approve',sorted(SL.filter(s=>stOf(s)==='reviewed'&&!editedSince(s))),s=>'Set to Approved once you are satisfied, then save the clean Rev 0 in the sop approved folder'],
   ['Edited after it was reviewed or approved - re-check',sorted(SL.filter(editedSince)),s=>{const d=LIVE[s.id];return 'Saved '+d.mtime+' after it was marked '+SLAB[stOf(s)]}],
   ['Reviewer comments or tracked changes to resolve',sorted(SL.filter(s=>{const d=LIVE[s.id];return d&&(d.cm||d.tc)&&['drafting','review'].includes(stOf(s))&&!editedSince(s)})),s=>{const d=LIVE[s.id];return (d.cm?d.cm+' comment'+(d.cm>1?'s':''):'')+(d.cm&&d.tc?' · ':'')+(d.tc?d.tc+' tracked change'+(d.tc>1?'s':''):'')}],
   ['Drafted - not yet sent for review',sorted(SL.filter(s=>stOf(s)==='drafting'&&!(LIVE[s.id]&&(LIVE[s.id].cm||LIVE[s.id].tc)))),s=>'Set to In review when you send it to the team'],
   ['With reviewers',sorted(SL.filter(s=>stOf(s)==='review')),s=>'Waiting for review feedback'],
   ['Approved but past review date',sorted(SL.filter(revOd)),s=>'Review was due '+fmt(rec(s).review)]
  ].filter(g=>g[1].length);
  if(!G.length)return '<p class="note">Nothing is waiting on you right now. Drafts that are Reviewed, edited after review, carry comments to resolve, or are overdue for review will appear here.</p>';
  return G.map(([t,L,f])=>`<h3 style="font-size:15px;margin:12px 0 4px">${t} <span class="chip">${L.length}</span></h3><table>${L.slice(0,8).map(s=>`<tr class="row" data-sop="${s.id}"><td style="white-space:nowrap"><span class="dot" style="background:${domCol(s.dom)}"></span><code>${s.id}</code></td><td>${esc(s.title)}<div class="tag">${esc(f(s))}</div></td><td>${stChip(s)}</td></tr>`).join('')}</table>${L.length>8?`<p class="note">+${L.length-8} more - filter the SOP Library by status.</p>`:''}`).join('');
}
function heat(d){
  const st=SEED.stages[d],ar=Object.keys(SEED.areas[d]),col=domCol(d);
  let h=`<div class="panel" style="margin-bottom:12px"><h3 style="color:${col}">${esc(DOM[d].name)}</h3><div class="heat" style="grid-template-columns:150px repeat(${st.length},1fr)"><div class="h"></div>${st.map(x=>`<div class="h">${esc(x[1])}</div>`).join('')}`;
  for(const a of ar){const row=SL.filter(s=>s.dom===d&&s.area===a);if(!row.length)continue;
    h+=`<div class="r">${esc(areaName(d,a))}</div>`+st.map(([c])=>{const L=row.filter(s=>s.stage===c);if(!L.length)return `<div style="opacity:.3">·</div>`;
      const ap=L.filter(s=>stOf(s)==='approved').length,p=ap/L.length;
      return `<div style="cursor:pointer;background:${p===1?col:p>0?col+'55':'var(--fill)'};color:${p===1?'#fff':'var(--ink)'}" data-dom="${d}" data-stage="${c}" data-area="${a}" title="${ap} approved of ${L.length}">${ap}/${L.length}</div>`}).join('')}
  return h+'</div></div>';
}

/* ---------- Library ---------- */
function libList(){

function libTable(L){

  for(const s of order){
    const g=s.dom+s.stage;if(g!==last){last=g;h+=`<tr class="grp" style="color:${domCol(s.dom)}"><td colspan="9">${esc(DOM[s.dom].short)} · ${esc(stageName(s.dom,s.stage))}</td></tr>`}
    h+=`<tr class="row" data-sop="${s.id}"><td style="white-space:nowrap"><span class="dot" style="background:${domCol(s.dom)}"></span><code>${s.id}</code></td><td>${esc(s.title)}<div class="tag">${esc(areaName(s.dom,s.area))}${rec(s).link?' · <b>linked</b>':''}</div></td><td>${esc(SEED.types[s.type])}</td><td>${pChip(s)}</td><td>${stChip(s)}<div><select class="qs" data-qs="${s.id}" title="Change status" style="font-size:12px;margin-top:3px">${SORDER.slice().reverse().map(k=>`<option value="${k}" ${stOf(s)===k?'selected':''}>${SLAB[k]}</option>`).join('')}</select></div></td><td>${docCell(s)}</td><td>${esc(rec(s).owner||'')}</td><td>${fmt(rec(s).review)}</td><td>${s.f.slice(0,5).map(f=>`<span class="chip f">${f}</span>`).join('')}${s.f.length>5?'…':''}</td></tr>`;
  }
  return h+'</table>';
}

function csvCell(v){v=String(v==null?'':v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function dl(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:type||'text/csv'}));a.download=name;a.click()}
function exportLib(L){
  const rows=[['ID','Domain','Stage','Area','Type','Title','Priority','Status','Owner','Doc no','Rev','Approved','Next review','Link','s.675 clauses','Findings']].concat(L.map(s=>{const r=rec(s);return [s.id,DOM[s.dom].name,stageName(s.dom,s.stage),areaName(s.dom,s.area),SEED.types[s.type],s.title,s.p,SLAB[stOf(s)],r.owner,r.docno,r.rev,r.appr,r.review,r.link,s.cl.join(' '),s.f.join(' ')]}));
  dl('sop_register_'+TODAY+'.csv',rows.map(r=>r.map(csvCell).join(',')).join('\n'));
}

  ${SEED.clauses.map(([c,t,sec,d])=>{const L=SL.filter(s=>s.cl.includes(c)),ap=L.filter(s=>stOf(s)==='approved').length;
   const fo=new Set();L.forEach(s=>s.f.forEach(f=>{if(F[f]&&F[f].kind!=='VN'&&(ST.fnd[f]||{}).st!=='closed')fo.add(f)}));

let INC={incidents:[]},IETAG=null;
const DEFAULT_INC_PATH='Documents/Current document editing/new AI projects/state gas sop/private/incident_register.json';
const incPath=()=>(cfg()||{}).incPath||DEFAULT_INC_PATH;
async function incLoad(){
  try{
    if(MODE==='server'){const r=await fetch('/api/incidents',{cache:'no-store'});if(r.ok)Object.assign(INC,await r.json()||{});return}
    const t=await msalToken(false),h={Authorization:'Bearer '+t},p=encodeURI(incPath());
    const meta=await fetch(GRAPH+'/me/drive/root:/'+p,{headers:h});
    if(meta.status===404){IETAG=null;return}
    if(!meta.ok)throw new Error('OneDrive '+meta.status);
    IETAG=(await meta.json()).eTag;
    const r=await fetch(GRAPH+'/me/drive/root:/'+p+':/content',{headers:h});
    if(r.ok)Object.assign(INC,await r.json());
  }catch(e){toast('Could not load the incident register: '+e.message)}
  INC.incidents=INC.incidents||[];
}
let incT;
function saveInc(){clearTimeout(incT);incT=setTimeout(async()=>{
  try{
    if(MODE==='server'){await fetch('/api/incidents',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(INC)});return}
    const t=await msalToken(true),h={Authorization:'Bearer '+t,'Content-Type':'application/json'};if(IETAG)h['If-Match']=IETAG;
    const r=await fetch(GRAPH+'/me/drive/root:/'+encodeURI(incPath())+':/content',{method:'PUT',headers:h,body:JSON.stringify(INC)});
    if(r.status===412){toast('Incident register was changed elsewhere - reload before editing further');return}
    if(!r.ok)throw new Error('OneDrive '+r.status);IETAG=(await r.json()).eTag;
  }catch(e){toast('Incident save failed: '+e.message)}},400)}

const I_TYPES={injury:'Injury / illness',release:'Gas release / loss of containment',fire:'Fire / explosion',env:'Environmental incident',prop:'Property / equipment damage',veh:'Vehicle incident',sce:'Safety-critical equipment failure / unplanned trip',nm:'Near miss',haz:'Hazard observation',sec:'Security / unauthorised access',nc:'Non-conformance / procedure not followed',oth:'Other'};

const nowDT=()=>{const d=new Date();return iso(d)+'T'+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};

function cdParts(due){const ms=dtMs(due)-Date.now();const a=Math.abs(ms),h=Math.floor(a/36e5),m=Math.floor(a%36e5/6e4);
  const txt=h>=48?`${Math.floor(h/24)}d ${h%24}h`:`${h}h ${String(m).padStart(2,'0')}m`;return {ms,txt}}
function cdChip(i){
  const n=i.notif||{};
  if(n.sent)return `<span class="chip approved" title="Notified ${fmtDT(n.sent)}">Notified ${fmtDT(n.sent)}</span>`;
  if(!n.due)return n.req==='no'?'<span class="chip">Not required</span>':(incScreen(i)?'<span class="chip gap">Assess notification now</span>':'<span class="tag">—</span>');
  const c=cdParts(n.due);
  return c.ms<0?`<span class="chip od cd" data-due="${esc(n.due)}">OVERDUE ${c.txt}</span>`:`<span class="chip ${c.ms<4*36e5?'gap':'review'} cd" data-due="${esc(n.due)}">Due in ${c.txt}</span>`;
}
const incScreen=i=>Object.keys((i.screen||{})).some(k=>i.screen[k]);
const hipo=i=>(+i.sevP||0)>=4&&i.type!=='haz';
const openActs=i=>(i.actions||[]).filter(a=>a.st!=='done');
const odActs=i=>openActs(i).filter(a=>a.due&&a.due<TODAY);
function timerOf(i){const n=i.notif||{};return(!n.sent&&n.due&&n.req!=='no'&&i.status!=='closed')}
function nextId(y){const mx=Math.max(0,...INC.incidents.filter(i=>i.id.startsWith('INC-'+y+'-')).map(i=>+i.id.split('-')[2]));return `INC-${y}-${String(mx+1).padStart(3,'0')}`}

function incStats(){
  const L=INC.incidents,open=L.filter(i=>i.status!=='closed'),y=new Date();y.setFullYear(y.getFullYear()-1);const y1=iso(y);
  const rec=L.filter(i=>I_REC.includes(i.outcome)).map(i=>i.occurred.slice(0,10)).sort().pop();
  return {all:L.length,open:open.length,timers:open.filter(timerOf).length,ovd:open.filter(i=>timerOf(i)&&dtMs(i.notif.due)<Date.now()).length,acts:L.reduce((a,i)=>a+odActs(i).length,0),

}

/* ============ KPIs ============ */
function kpiAuto(id){
  const S=omsStats(),a=stats(''),A=allActions();
  const F=((ST.private||{}).findings||[]).filter(f=>f.kind!=='G');
  switch(id){
   case 'K01':return a.n?Math.round(a.c.approved/a.n*1000)/10:null;
   case 'K02':return a.p1;case 'K03':return S.od;
   case 'K04':{const y=addD(TODAY,-365),c=ST.oms.actions.filter(x=>x.st==='closed'&&x.due&&x.vdate&&x.vdate>=y);return c.length?Math.round(c.filter(x=>x.vdate<=x.due).length/c.length*1000)/10:null}
   case 'K05':return F.filter(f=>((ST.fnd[f.id]||{}).st||'open')!=='closed').length;
   case 'K06':return S.sce;case 'K07':return S.trainReq?Math.round(S.trainOk/S.trainReq*1000)/10:null;
   case 'K08':{const n=ST.oms.audits.filter(x=>x.next).length;return n?Math.round((n-S.audOd)/n*1000)/10:null}
   case 'K09':return S.riskHi;case 'K10':return incStats().y12;
   case 'K15':return trifr();case 'K16':return S.corpOd;case 'K17':return S.riskOut;
  }return null;
}
function trifr(){const y=addD(TODAY,-365).slice(0,7),O=ST.oms;
  const hrs=O.readings.filter(r=>r.k==='K13'&&r.p>=y).reduce((s,r)=>s+(+r.v||0),0);
  const inj=INC.incidents.filter(i=>I_REC.includes(i.outcome)&&i.occurred.slice(0,10)>=addD(TODAY,-365)).length;
  return hrs>0?Math.round(inj*1e6/hrs*100)/100:null}
function kpiList(){const X=[{id:'K15',name:'TRIFR - recordable injuries per million hours (rolling 12 months; needs hours worked entered)',el:9,kind:'auto',unit:'rate',target:'',dir:'down'},{id:'K16',name:'Corporate documents past review date',el:2,kind:'auto',unit:'count',target:0,dir:'down'},{id:'K17',name:'Open risks with residual rating above stated appetite',el:5,kind:'auto',unit:'count',target:0,dir:'down'}];return ST.oms.kpis.concat(X.filter(x=>!ST.oms.kpis.some(k=>k.id===x.id)))}
function kpiVal(k){if(k.kind==='auto')return kpiAuto(k.id);const r=ST.oms.readings.filter(x=>x.k===k.id).sort((a,b)=>b.p.localeCompare(a.p))[0];return r?+r.v:null}
function kpiMet(k,v){if(v==null||k.target===''||k.target==null||k.dir==='info')return '';return (k.dir==='up'?v>=+k.target:v<=+k.target)?'ok':'bad'}
function kpiSnap(){const p=TODAY.slice(0,7),O=ST.oms;if(O.meta.snapPeriod===p)return;O.meta.snapPeriod=p;
  kpiList().filter(k=>k.kind==='auto').forEach(k=>{const v=kpiAuto(k.id);if(v!=null&&!O.readings.some(r=>r.k===k.id&&r.p===p))O.readings.push({k:k.id,p,v,auto:1})});save()}
function spark(k){const r=ST.oms.readings.filter(x=>x.k===k.id).sort((a,b)=>a.p.localeCompare(b.p)).slice(-12);if(r.length<2)return '<span class="tag">trend builds monthly</span>';
  const vs=r.map(x=>+x.v),mn=Math.min(...vs),mx=Math.max(...vs),w=90,h=22;
  const pts=vs.map((v,i)=>`${(i/(vs.length-1)*w).toFixed(1)},${(mx===mn?h/2:h-2-(v-mn)/(mx-mn)*(h-4)).toFixed(1)}`).join(' ');
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-label="trend"><polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="1.8"/></svg>`}
FILT.kper=TODAY.slice(0,7);
function vKpi(m){
  const K=kpiList(),per=FILT.kper;
  m.innerHTML=`<h2>Performance indicators</h2>
  <p class="note">Indicators that measure whether the system is working, not just whether documents exist. "Auto" indicators are calculated live from the other modules and a monthly snapshot is stored so trends build up. "Manual" indicators are entered each month. Targets are starting points for you to set. The audit found indicators that were not backed by a process (F06, F29): each of these has a data source.</p>
  <div class="bar"><span class="note">Month for manual entry:</span><input type="month" id="kp" value="${per}"><button class="btn sm" id="kadd">Add an indicator</button><button class="btn sm" id="ksnap">Save a snapshot of auto values now</button><button class="btn sm" id="kcsv">Export CSV</button></div>
  <table><tr><th>Ref</th><th>Indicator</th><th>Element</th><th>Type</th><th>Current</th><th>Target</th><th>Trend</th><th>Enter for ${per}</th></tr>
  ${K.map(k=>{const v=kpiVal(k),met=kpiMet(k,v),cur=ST.oms.readings.find(r=>r.k===k.id&&r.p===per&&!r.auto);
   return `<tr><td><code>${k.id}</code></td><td>${ST.oms.kpis.includes(k)?`<input data-kk="${k.id}" data-f="name" value="${esc(k.name)}" style="width:100%">`:esc(k.name)}</td><td>${k.el}</td><td>${k.kind==='auto'?'Auto':'Manual'}</td>

  $('#drev').onclick=()=>{d.last=TODAY;d.next=d.freq?addM(TODAY,+d.freq):'';d.hist=(d.hist||[]).concat([{d:TODAY,s:'reviewed'}]);if(d.st==='review')d.st='current';save();openCorp(id)};
  $('#dact').onclick=()=>{const a={id:nextNo('ACT',ST.oms.actions),title:'Review / update: '+d.title,src:'Other',ref:d.id,pri:'medium',st:'open',raised:TODAY,due:n||addD(TODAY,90),owner:d.owner||'',el:2,notes:'',hist:[]};ST.oms.actions.unshift(a);save();openAct('N:'+a.id)};
  $('#ddel').onclick=()=>{if(confirm('Remove this line from the register? The stored file, if any, is not deleted.')){ST.oms.corp=ST.oms.corp.filter(x=>x.id!==id);save();closeDrawer();render()}};
  $('#dopen')&&($('#dopen').onclick=e=>{e.preventDefault();corpOpen(id)});$('#dshow')&&($('#dshow').onclick=e=>{e.preventDefault();corpOpen(id,1)});
  if(SERVER){$('#dup').onclick=()=>$('#dfile').click();$('#dfile').onchange=async e=>{const f=e.target.files[0];if(!f)return;const nm=await corpUpload(f);if(nm){d.file=nm;save();await loadCorp();openCorp(id)}}}
}

(async()=>{
  /* Microsoft silent sign-in loads this page in a hidden frame; it must not run the app or consume the sign-in response there */
  if(window.self!==window.top&&/[#?&](code|error|state|id_token)=/.test(location.hash+location.search))return;
  const ok=await loadState();if(!ok)return;
  await incLoad();
  for(const k of ['sops','fnd','sce','docs','people','notice'])ST[k]=ST[k]||{};
  for(const k of ['sceX','chg','commit'])ST[k]=ST[k]||[];ST.settings=ST.settings||{};
  if(ST.settings.theme)document.documentElement.dataset.theme=ST.settings.theme;
  seedDrafts();
  omsInit();corpSeed();kpiSnap();
  await loadLive();await loadCorp();
  render();
  document.addEventListener('visibilitychange',async()=>{if(!document.hidden){await loadLive();await loadCorp();if(!$('#drawer').classList.contains('open')&&(VIEW==='lib'||VIEW==='home'||VIEW==='corp'))render()}});
})();
</script>
</body>
</html>
